name: Release

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - master

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: faerite-${{ github.ref_name }}-windows.zip
          - os: macos-latest
            artifact_name: faerite-${{ github.ref_name }}-mac.zip
          - os: ubuntu-latest
            artifact_name: faerite-${{ github.ref_name }}-linux.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # The ubuntu headless server requires UI libraries to compile a JavaFX app.
      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev

      - name: Build with Maven
        run: mvn clean compile javafx:jlink

      - name: Package Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          jpackage --type app-image --runtime-image target/image --name Faerite --module faerite/faerite.Main --dest out
          cd out && zip -r ../${{ matrix.artifact_name }} Faerite

      - name: Package Windows
        if: matrix.os == 'windows-latest'
        run: |
          jpackage --type app-image --runtime-image target/image --name Faerite --module faerite/faerite.Main --dest out
          Compress-Archive -Path out/Faerite/* -DestinationPath ${{ matrix.artifact_name }}

      - name: Package Mac
        if: matrix.os == 'macos-latest'
        run: |
          jpackage --type app-image --runtime-image target/image --name Faerite --module faerite/faerite.Main --dest out
          cd out && zip -r ../${{ matrix.artifact_name }} Faerite.app

      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract release message
        id: tag_data
        run: |
          git for-each-ref --format='%(*subject)' refs/tags/${{ github.ref_name }} > title.txt
          git for-each-ref --format='%(*body)' refs/tags/${{ github.ref_name }} > body.txt
          
          echo "TITLE=$(cat title.txt)" >> $GITHUB_ENV
          
          echo "BODY<<EOF" >> $GITHUB_ENV
          cat body.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.TITLE }}
          body: ${{ env.BODY }}
          generate_release_notes: true
          files: artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

